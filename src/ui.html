<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Frame2PPT</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --border: var(--figma-color-border, rgba(0, 0, 0, 0.08));
    --card-bg: var(--figma-color-bg-secondary, #f5f5f5);
    --accent: var(--figma-color-bg-brand, #0d99ff);
    --accent-hover: var(--figma-color-bg-brand-hover, #007be5);
    --accent-pressed: var(--figma-color-bg-brand-pressed, #0a84e6);
    --danger: var(--figma-color-text-danger, #f24822);
    --success: var(--figma-color-text-success, #1f9d55);
    --text-sub: var(--figma-color-text-secondary, rgba(0, 0, 0, 0.6));
    --radius: 8px;
  }

  html, body { height: 100%; }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 12px;
    color: var(--figma-color-text, #1e1e1e);
    background: var(--figma-color-bg, #ffffff);
    padding: 14px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    -webkit-font-smoothing: antialiased;
  }

  .hidden { display: none !important; }

  /* ---- 头部 ---- */
  .app-header {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-badge {
    width: 34px;
    height: 34px;
    flex: none;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    background: linear-gradient(135deg, var(--accent), #6d5ef0);
    box-shadow: 0 2px 6px rgba(13, 153, 255, 0.35);
  }
  .app-title h1 { font-size: 14px; font-weight: 700; line-height: 1.3; }
  .app-title p { font-size: 11px; color: var(--text-sub); line-height: 1.4; }
  .version {
    margin-left: auto;
    font-size: 10px;
    color: var(--text-sub);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2px 7px;
  }

  /* ---- 卡片 ---- */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
  }
  .card-head {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
  }
  .card-head h2 { font-size: 11px; font-weight: 700; letter-spacing: 0.2px; }
  .card-head svg { color: var(--text-sub); }

  .icon-btn {
    margin-left: auto;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--figma-color-text, #1e1e1e);
    cursor: pointer;
    transition: background 0.15s;
  }
  .icon-btn:hover { background: var(--figma-color-bg-hover, rgba(0, 0, 0, 0.06)); }
  .icon-btn:active { background: var(--figma-color-bg-pressed, rgba(0, 0, 0, 0.1)); }

  /* ---- 选择区 ---- */
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 18px 8px;
    text-align: center;
    color: var(--text-sub);
    line-height: 1.6;
  }
  .empty svg { color: var(--figma-color-icon-secondary, rgba(0, 0, 0, 0.4)); }

  .frame-list { list-style: none; display: flex; flex-direction: column; gap: 4px; max-height: 132px; overflow-y: auto; }
  .frame-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    background: var(--figma-color-bg, #ffffff);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .frame-idx {
    flex: none;
    width: 18px;
    height: 18px;
    border-radius: 5px;
    background: var(--figma-color-bg-brand, #0d99ff);
    color: #ffffff;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frame-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .frame-size { flex: none; font-size: 11px; color: var(--text-sub); }

  /* ---- 设置 ---- */
  .field { margin-bottom: 10px; }
  .field:last-child { margin-bottom: 2px; }
  .field-label { display: block; font-size: 11px; color: var(--text-sub); margin-bottom: 4px; }

  select, input[type="text"] {
    width: 100%;
    height: 30px;
    padding: 0 8px;
    font-size: 12px;
    font-family: inherit;
    color: var(--figma-color-text, #1e1e1e);
    background: var(--figma-color-bg, #ffffff);
    border: 1px solid var(--figma-color-border, rgba(0, 0, 0, 0.15));
    border-radius: 6px;
    outline: none;
    appearance: none;
    transition: border-color 0.15s;
  }
  select {
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="%23888" stroke-width="1.5"><path d="m2 3.5 3 3 3-3"/></svg>');
    background-repeat: no-repeat;
    background-position: right 8px center;
    padding-right: 24px;
  }
  select:focus, input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(13, 153, 255, 0.18); }

  .radio-row { display: flex; gap: 14px; }
  .radio { display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
  .radio input { accent-color: var(--accent); width: 13px; height: 13px; }

  /* ---- 底部动作 ---- */
  .actions { display: flex; flex-direction: column; gap: 8px; }

  .btn-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 10px 12px;
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-primary:active:not(:disabled) { background: var(--accent-pressed); transform: translateY(1px); }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary.loading { opacity: 0.75; }

  .progress { display: flex; flex-direction: column; gap: 5px; }
  .progress-track {
    height: 6px;
    border-radius: 3px;
    background: var(--figma-color-bg-tertiary, rgba(0, 0, 0, 0.08));
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), #6d5ef0);
    transition: width 0.25s ease;
  }
  .progress-text { font-size: 11px; color: var(--text-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .status {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.5;
  }
  .status svg { flex: none; margin-top: 1px; }
  .status.success { background: rgba(31, 157, 85, 0.1); color: var(--success); }
  .status.success svg { color: var(--success); }
  .status.error { background: rgba(242, 72, 34, 0.1); color: var(--danger); }
  .status.error svg { color: var(--danger); }

  .hint {
    font-size: 10.5px;
    color: var(--text-sub);
    line-height: 1.6;
    text-align: center;
  }
</style>
</head>
<body>
  <header class="app-header">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="11" height="11" rx="2"/>
        <rect x="10" y="10" width="11" height="11" rx="2"/>
        <path d="M8.5 5v6M5.5 8h6"/>
      </svg>
    </div>
    <div class="app-title">
      <h1>Frame2PPT</h1>
      <p>将 Figma Frame 转换为可编辑 PPT</p>
    </div>
    <span class="version">v1.0</span>
  </header>

  <section class="card">
    <div class="card-head">
      <h2>画布选择</h2>
      <button id="rescanBtn" class="icon-btn" title="重新获取选中的 Frame">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/>
          <path d="M13.5 2.5v3h-3"/>
        </svg>
      </button>
    </div>
    <div id="selectionEmpty" class="empty">
      <svg viewBox="0 0 48 48" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="6" width="36" height="36" rx="4"/>
        <path d="M6 18h36M24 6v36"/>
      </svg>
      <span>请在画布中选择要转换的 Frame<br />支持多选，每个 Frame 生成一页</span>
    </div>
    <ul id="frameList" class="frame-list hidden"></ul>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>转换设置</h2>
      <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="2.4"/>
        <path d="M13 8.6a1 1 0 0 1 .2-1.1l.1-.1a1.5 1.5 0 1 0-2.1-2.1l-.1.1a1 1 0 0 1-1.1.2 1 1 0 0 1-.6-.9V4.5a1.5 1.5 0 1 0-3 0v.1a1 1 0 0 1-.6.9 1 1 0 0 1-1.1-.2l-.1-.1a1.5 1.5 0 1 0-2.1 2.1l.1.1a1 1 0 0 1 .2 1.1 1 1 0 0 1-.9.6H4.5a1.5 1.5 0 1 0 0 3h.1a1 1 0 0 1 .9.6 1 1 0 0 1-.2 1.1l-.1.1a1.5 1.5 0 1 0 2.1 2.1l.1-.1a1 1 0 0 1 1.1-.2 1 1 0 0 1 .6.9v.1a1.5 1.5 0 1 0 3 0v-.1a1 1 0 0 1 .6-.9 1 1 0 0 1 1.1.2l.1.1a1.5 1.5 0 1 0 2.1-2.1l-.1-.1a1 1 0 0 1-.2-1.1 1 1 0 0 1 .9-.6h.1a1.5 1.5 0 1 0 0-3h-.1a1 1 0 0 1-.9-.6Z"/>
      </svg>
    </div>
    <div class="field">
      <label class="field-label" for="slideSize">幻灯片尺寸</label>
      <select id="slideSize">
        <option value="16x9" selected>16:9（默认）</option>
        <option value="16x10">16:10</option>
        <option value="4x3">4:3</option>
        <option value="wide">宽屏 16:9（13.3 英寸）</option>
      </select>
    </div>
    <div class="field">
      <span class="field-label">缩放模式</span>
      <div class="radio-row">
        <label class="radio"><input type="radio" name="scaleMode" value="fit" checked /><span>自适应居中</span></label>
        <label class="radio"><input type="radio" name="scaleMode" value="stretch" /><span>拉伸铺满</span></label>
      </div>
    </div>
    <div class="field">
      <label class="field-label" for="exportScale">图片导出精度</label>
      <select id="exportScale">
        <option value="1">1x</option>
        <option value="2" selected>2x（推荐）</option>
        <option value="3">3x</option>
      </select>
    </div>
    <div class="field">
      <label class="field-label" for="fileName">文件名</label>
      <input id="fileName" type="text" value="Frame2PPT" spellcheck="false" />
    </div>
  </section>

  <div class="actions">
    <button id="convertBtn" class="btn-primary" disabled>
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 2.5v8"/>
        <path d="m4.5 7 3.5 3.5L11.5 7"/>
        <path d="M2.5 13.5h11"/>
      </svg>
      <span>转换并下载 PPT</span>
    </button>
    <div id="progressWrap" class="progress hidden">
      <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
      <span id="progressText" class="progress-text">准备中…</span>
    </div>
    <div id="status" class="status hidden"></div>
  </div>

  <p class="hint">提示：文字、色块、圆形、线条、星形等保持可编辑；复杂矢量、渐变以图片嵌入。</p>

  <script src="../ui-bundle.js"></script>
</body>
</html>
